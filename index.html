<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کلیپ مذهبی - ویدیوهای مذهبی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    min-height: 100vh;
  }

  /* هدر */
  .main-header {
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(15px);
    padding: 20px 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom: 1px solid rgba(0,212,255,0.2);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    font-size: 2rem;
    filter: drop-shadow(0 0 10px #00d4ff);
  }
  .logo-text h1 {
    font-size: 1.4rem;
    background: linear-gradient(90deg, #00d4ff, #00ffa3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
  }
  .logo-text p { font-size: 0.75rem; color: #888; }

  /* هیرو */
  .hero {
    text-align: center;
    padding: 50px 20px 30px;
  }
  .hero h2 {
    font-size: 2.2rem;
    margin-bottom: 12px;
    font-weight: 800;
  }
  .hero h2 span {
    background: linear-gradient(90deg, #00d4ff, #00ffa3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p { color: #aaa; font-size: 1rem; }

  /* جستجو */
  .search-box {
    max-width: 500px;
    margin: 25px auto;
    position: relative;
    padding: 0 20px;
  }
  .search-box input {
    width: 100%;
    padding: 14px 45px 14px 18px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    backdrop-filter: blur(10px);
  }
  .search-box input:focus {
    outline: none;
    border-color: #00d4ff;
    box-shadow: 0 0 20px rgba(0,212,255,0.2);
  }
  .search-box::before {
    content: '🔍';
    position: absolute;
    right: 35px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }

  /* گرید ویدیوها */
  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 20px 30px 60px;
  }

  .videos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 25px;
  }

  .video-card {
    background: rgba(255,255,255,0.04);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(5px);
  }
  .video-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 40px rgba(0,212,255,0.25);
    border-color: rgba(0,212,255,0.4);
  }

  .video-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
  }
  .video-frame iframe,
  .video-frame video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .video-info { padding: 18px; }
  .video-info h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: #00ffa3;
    font-weight: 700;
  }
  .video-info p {
    font-size: 0.88rem;
    color: #bbb;
    line-height: 1.7;
    margin-bottom: 10px;
  }
  .video-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: #888;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .badge.aparat { background: linear-gradient(90deg,#e63946,#ff4757); color: #fff; }
  .badge.youtube { background: linear-gradient(90deg,#ff0000,#ff4444); color: #fff; }
  .badge.mp4 { background: linear-gradient(90deg,#00d4ff,#00ffa3); color: #000; }

  /* حالت خالی */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #888;
    grid-column: 1/-1;
  }
  .empty-state .icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.5; }
  .empty-state h3 { color: #ccc; margin-bottom: 10px; }
  .empty-state p { font-size: 0.9rem; }

  /* Skeleton Loading */
  .skeleton {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    overflow: hidden;
    height: 320px;
    position: relative;
  }
  .skeleton::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* فوتر */
  footer {
    text-align: center;
    padding: 30px;
    color: #666;
    font-size: 0.85rem;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  footer span { color: #00d4ff; }

  /* موبایل */
  @media (max-width: 600px) {
    .main-header { padding: 15px 20px; }
    .logo-text h1 { font-size: 1.1rem; }
    .hero h2 { font-size: 1.6rem; }
    .container { padding: 15px 20px 40px; }
    .videos-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="main-header">
  <div class="logo">
    <div class="logo-icon">🕌</div>
    <div class="logo-text">
      <h1>کلیپ مذهبی</h1>
      <p>مجموعه ویدیوهای مذهبی</p>
    </div>
  </div>
</header>

<section class="hero">
  <h2>به <span>کلیپ مذهبی</span> خوش آمدید</h2>
  <p>مجموعه‌ای از ویدیوهای مذهبی و معنوی</p>
</section>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="جستجوی ویدیو..." />
</div>

<main class="container">
  <div id="videosContainer" class="videos-grid">
    <!-- skeleton -->
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</main>

<footer>
  ساخته شده با ❤️ برای <span>کلیپ مذهبی</span> - تمامی حقوق محفوظ است
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ========= تنظیمات Supabase =========
  const SUPABASE_URL = 'https://ndumhscrbnoxbswzlnnv.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kdW1oc2NyYm5veGJzd3psbm52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjk4MzIsImV4cCI6MjEwNzY0NTgzMn0.opc7Psn093phcZSm5YgipukRLP6afiNDFG3KsOqPi8o';
  // =====================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let allVideos = [];

  // ======== استخراج ID ========
  function extractVideoId(url, platform) {
    try {
      if (platform === 'youtube') {
        if (url.includes('youtube.com/watch')) return new URL(url).searchParams.get('v');
        if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split(/[?&]/)[0];
        if (url.includes('/embed/')) return url.split('/embed/')[1].split(/[?&]/)[0];
        if (url.includes('/shorts/')) return url.split('/shorts/')[1].split(/[?&]/)[0];
      }
      if (platform === 'aparat') {
        if (url.includes('aparat.com/v/')) return url.split('/v/')[1].split(/[/?#]/)[0];
        if (url.includes('videohash/')) return url.split('videohash/')[1].split(/[/?#]/)[0];
      }
    } catch (e) { return null; }
    return null;
  }

  // ======== ساخت Embed ========
  function buildEmbed(url, platform) {
    if (platform === 'mp4') {
      return `<video controls preload="metadata" src="${url}"></video>`;
    }
    const id = extractVideoId(url, platform);
    if (!id) {
      return `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#f66;font-size:0.85rem;padding:20px;text-align:center;">لینک نامعتبر است</div>`;
    }
    let embedUrl = '';
    if (platform === 'youtube') embedUrl = `https://www.youtube.com/embed/${id}`;
    else if (platform === 'aparat') embedUrl = `https://www.aparat.com/video/video/embed/videohash/${id}/vt/frame`;
    return `<iframe src="${embedUrl}" allowfullscreen loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>`;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // ======== نمایش ویدیوها ========
  function renderVideos(videos) {
    const container = document.getElementById('videosContainer');

    if (!videos || videos.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <h3>هنوز ویدیویی اضافه نشده</h3>
          <p>به زودی ویدیوهای جدید اضافه می‌شود</p>
        </div>`;
      return;
    }

    const platformNames = { aparat: 'آپارات', youtube: 'یوتیوب', mp4: 'MP4' };

    container.innerHTML = videos.map(v => `
      <div class="video-card">
        <div class="video-frame">${buildEmbed(v.video_url, v.platform)}</div>
        <div class="video-info">
          <span class="badge ${v.platform}">${platformNames[v.platform] || v.platform}</span>
          <h3>${escapeHtml(v.title)}</h3>
          ${v.description ? `<p>${escapeHtml(v.description)}</p>` : ''}
          <div class="video-meta">
            <span>📅 ${new Date(v.created_at).toLocaleDateString('fa-IR')}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ======== بارگذاری اولیه ========
  async function loadVideos() {
    const { data, error } = await sb
      .from('videos')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('videosContainer').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>خطا در بارگذاری</h3>
          <p>${error.message}</p>
        </div>`;
      return;
    }

    allVideos = data || [];
    renderVideos(allVideos);
  }

  // ======== جستجو ========
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) return renderVideos(allVideos);
    const filtered = allVideos.filter(v =>
      v.title.toLowerCase().includes(q) ||
      (v.description || '').toLowerCase().includes(q)
    );
    renderVideos(filtered);
  });

  // ======== Real-time (آپدیت خودکار) ========
  sb.channel('videos-channel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'videos' }, () => {
      loadVideos();
    })
    .subscribe();

  // ======== شروع ========
  loadVideos();
</script>
</body>
</html>
